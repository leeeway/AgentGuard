[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "The Runtime Safety Enclave & Instant Undo Engine for Autonomous AI Coding Agents"
readme = "README.md"
authors = [
    { name = "leeway" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
agentguard = "agentguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentguard*"]
